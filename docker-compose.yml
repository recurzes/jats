services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jats
      POSTGRES_PASSWORD: jats
      POSTGRES_DB: jats
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, when the volume is first created.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jats -d jats"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
