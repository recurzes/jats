name: api

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jats
          POSTGRES_PASSWORD: jats
          POSTGRES_DB: jats_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jats -d jats_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://jats:jats@localhost:5433/jats_test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked

      - run: uv run ruff check .

      - run: uv run pytest
